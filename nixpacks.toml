# Pin Node for Nixpacks / Railway (matches local nvm 24.x requirement).
[variables]
NIXPACKS_NODE_VERSION = "24"
# Keep Playwright browsers in a stable path across build → runtime.
PLAYWRIGHT_BROWSERS_PATH = "/root/.cache/ms-playwright"

# Quiet Mode audio: ffmpeg for mix/encode; flite for optional spoken quotes.
# Playwright Chromium: shared libraries required to *launch* the downloaded
# browser (binary alone is not enough — missing .so → "browser has been closed").
# Package names match Playwright's ubuntu-22.04 chromium list (also resolve on
# 24.04 via transitional packages). Do NOT use install-deps font packages —
# several are unavailable on Railway's apt mirrors and break the build.
[phases.setup]
aptPkgs = [
  "ffmpeg",
  "flite",
  "libflite1",
  # Chromium / Playwright runtime
  "libasound2",
  "libatk-bridge2.0-0",
  "libatk1.0-0",
  "libatspi2.0-0",
  "libcairo2",
  "libcups2",
  "libdbus-1-3",
  "libdrm2",
  "libegl1",
  "libgbm1",
  "libglib2.0-0",
  "libgtk-3-0",
  "libnspr4",
  "libnss3",
  "libpango-1.0-0",
  "libwayland-client0",
  "libx11-6",
  "libx11-xcb1",
  "libxcb1",
  "libxcomposite1",
  "libxdamage1",
  "libxext6",
  "libxfixes3",
  "libxkbcommon0",
  "libxrandr2",
  "libxshmfence1",
  "fonts-liberation",
  "ca-certificates",
]
