# Pin Node for Nixpacks / Railway (matches local nvm 24.x requirement).
[variables]
NIXPACKS_NODE_VERSION = "24"
# Keep Playwright browsers in a stable path across build → runtime.
PLAYWRIGHT_BROWSERS_PATH = "/root/.cache/ms-playwright"

# Quiet Mode audio: ffmpeg for mix/encode; flite for optional spoken quotes.
# Playwright Chromium: shared libraries required to *launch* the downloaded
# browser (binary alone is not enough — missing .so → "browser has been closed").
#
# Railway's nixpacks image is Ubuntu 24.04 (noble). Several libs were renamed
# with a `t64` suffix — `libasound2` is only a virtual package there and
# `apt-get install libasound2` fails with "no installation candidate".
# Names below match Playwright's ubuntu-24.04 chromium dependency list.
[phases.setup]
aptPkgs = [
  "ffmpeg",
  "flite",
  "libflite1",
  # Chromium / Playwright runtime (Ubuntu 24.04 / noble)
  "libasound2t64",
  "libatk-bridge2.0-0t64",
  "libatk1.0-0t64",
  "libatspi2.0-0t64",
  "libcairo2",
  "libcups2t64",
  "libdbus-1-3",
  "libdrm2",
  "libegl1",
  "libgbm1",
  "libglib2.0-0t64",
  "libgtk-3-0t64",
  "libnspr4",
  "libnss3",
  "libpango-1.0-0",
  "libwayland-client0",
  "libx11-6",
  "libx11-xcb1",
  "libxcb1",
  "libxcomposite1",
  "libxdamage1",
  "libxext6",
  "libxfixes3",
  "libxkbcommon0",
  "libxrandr2",
  "libxshmfence1",
  "fonts-liberation",
  "ca-certificates",
]
